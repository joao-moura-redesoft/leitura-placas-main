{% extends "base.html" %}
{% block title %}Postos — ALPR{% endblock %}
{% block conteudo %}
<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
  <h1 style="margin:0">Postos</h1>
  <span id="filtro-badge" style="display:none;background:#dcfce7;color:#15803d;padding:4px 12px;
        border-radius:20px;font-size:13px;font-weight:600"></span>
  <a href="/entidades" style="color:#64748b;font-size:13px;margin-left:auto">← Entidades</a>
</div>

<div class="card" style="margin-bottom:16px">
  <button onclick="abrirModal()">+ Novo Posto</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>Entidade</th><th>CNPJ</th><th>Nome</th><th>Ativo</th><th>Ações</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="sem-itens" style="display:none;color:#94a3b8">Nenhum posto cadastrado.</p>
</div>

<!-- Modal -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);z-index:100;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:28px;width:460px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.18)">
    <h2 id="modal-titulo" style="margin-top:0">Novo Posto</h2>
    <form id="form" onsubmit="salvar(event)">
      <input type="hidden" id="f-id" value="">
      <label style="display:block;margin-bottom:12px">Entidade
        <select id="f-entidade" required style="width:100%;margin-top:4px"></select>
      </label>
      <label style="display:block;margin-bottom:12px">CNPJ
        <input id="f-cnpj" type="text" placeholder="00.000.000/0001-00" required style="width:100%;box-sizing:border-box;margin-top:4px">
      </label>
      <label style="display:block;margin-bottom:12px">Nome do posto
        <input id="f-nome" type="text" required style="width:100%;box-sizing:border-box;margin-top:4px">
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <input id="f-ativo" type="checkbox" checked style="width:auto;padding:0">
        Ativa
      </label>
      <div style="display:flex;gap:10px">
        <button type="submit" style="background:#16a34a">Salvar</button>
        <button type="button" onclick="fecharModal()" style="background:#fff;color:#374151;border:1px solid #e2e8f0">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<style>#modal-overlay.aberto { display: flex !important; }</style>
{% endblock %}

{% block scripts %}
<script>
const params = new URLSearchParams(location.search);
const FILTRO_ENTIDADE = params.get('entidade_id') ? parseInt(params.get('entidade_id')) : null;

let _itens = [];
let _entidades = [];
let _editandoId = null;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function nomeEntidade(id) {
  const e = _entidades.find(x => x.id === id);
  return e ? e.nome : `#${id}`;
}

async function carregarEntidades() {
  const res = await fetch('/api/entidades');
  _entidades = await res.json();
  const sel = document.getElementById('f-entidade');
  sel.innerHTML = _entidades.map(e => `<option value="${e.id}">${esc(e.nome)}</option>`).join('');
}

async function carregar() {
  const url = FILTRO_ENTIDADE ? `/api/empresas?entidade_id=${FILTRO_ENTIDADE}` : '/api/empresas';
  const res = await fetch(url);
  _itens = await res.json();
  if (FILTRO_ENTIDADE) {
    const badge = document.getElementById('filtro-badge');
    badge.style.display = '';
    badge.textContent = 'Filtrando por: ' + nomeEntidade(FILTRO_ENTIDADE);
  }
  renderTabela();
}

function renderTabela() {
  const tbody = document.getElementById('tbody');
  const sem = document.getElementById('sem-itens');
  tbody.innerHTML = '';
  if (!_itens.length) { sem.style.display = ''; return; }
  sem.style.display = 'none';
  _itens.forEach(it => {
    const ativo = it.ativo
      ? '<span class="badge badge-ok">Ativa</span>'
      : '<span class="badge badge-err">Inativa</span>';
    tbody.innerHTML += `<tr>
      <td>${esc(nomeEntidade(it.entidade_id))}</td>
      <td style="font-family:monospace">${esc(it.cnpj)}</td>
      <td>${esc(it.nome)}</td>
      <td>${ativo}</td>
      <td>
        <a href="/automacoes?empresa_id=${it.id}" style="display:inline-flex;align-items:center;padding:8px 12px;
           border-radius:7px;background:#0f172a;color:#fff;font-size:14px;font-weight:500;
           text-decoration:none;margin-right:4px">Automações</a>
        <a href="/cameras?empresa_id=${it.id}" style="display:inline-flex;align-items:center;padding:8px 12px;
           border-radius:7px;background:#0f172a;color:#fff;font-size:14px;font-weight:500;
           text-decoration:none;margin-right:4px">Câmeras</a>
        <button onclick="editar(${it.id})" style="background:#16a34a;margin-right:4px">Editar</button>
        <button onclick="remover(${it.id})" style="background:#dc2626">Remover</button>
      </td>
    </tr>`;
  });
}

function abrirModal(it = null) {
  _editandoId = it ? it.id : null;
  document.getElementById('modal-titulo').textContent = it ? 'Editar Posto' : 'Novo Posto';
  document.getElementById('f-id').value = it ? it.id : '';
  document.getElementById('f-entidade').value = it ? it.entidade_id : (FILTRO_ENTIDADE || '');
  document.getElementById('f-cnpj').value = it ? it.cnpj : '';
  document.getElementById('f-nome').value = it ? it.nome : '';
  document.getElementById('f-ativo').checked = it ? !!it.ativo : true;
  document.getElementById('modal-overlay').classList.add('aberto');
}

function fecharModal() { document.getElementById('modal-overlay').classList.remove('aberto'); }

function editar(id) {
  const it = _itens.find(x => x.id === id);
  if (it) abrirModal(it);
}

async function salvar(e) {
  e.preventDefault();
  const payload = {
    entidade_id: parseInt(document.getElementById('f-entidade').value),
    cnpj: document.getElementById('f-cnpj').value.trim(),
    nome: document.getElementById('f-nome').value.trim(),
    ativo: document.getElementById('f-ativo').checked,
  };
  const url = _editandoId ? `/api/empresas/${_editandoId}` : '/api/empresas';
  const metodo = _editandoId ? 'PUT' : 'POST';
  const res = await fetch(url, { method: metodo, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (res.ok) { fecharModal(); await carregar(); }
  else await avisarResposta(res);
}

async function remover(id) {
  const it = _itens.find(x => x.id === id);
  if (!confirmarExclusao(it?.nome, `o posto "${it?.nome}" e todas as câmeras, automações e bicos dele`)) return;
  const res = await fetch(`/api/empresas/${id}`, { method: 'DELETE' });
  if (res.ok) await carregar();
  else await avisarResposta(res);
}

(async () => {
  await carregarEntidades();
  await carregar();
})();
</script>
{% endblock %}
