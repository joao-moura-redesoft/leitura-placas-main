{% extends "base.html" %}
{% block title %}Minha Conta — ALPR{% endblock %}
{% block conteudo %}
<h1>Minha Conta</h1>

<div class="card" style="margin-bottom:16px;max-width:460px">
  <h3 style="margin-top:0;margin-bottom:10px">Dados</h3>
  <p style="margin:0 0 4px"><strong id="mc-nome">—</strong></p>
  <p style="margin:0 0 4px;color:#64748b;font-size:14px" id="mc-email">—</p>
  <span class="badge badge-mercosul" id="mc-papel" style="margin-top:6px;display:inline-flex"></span>
</div>

<div class="card" style="max-width:460px">
  <h3 style="margin-top:0;margin-bottom:10px">Trocar senha</h3>
  <form id="form-senha" onsubmit="trocarSenha(event)">
    <label style="display:block;margin-bottom:12px">Senha atual
      <input id="s-atual" type="password" required style="width:100%;box-sizing:border-box;margin-top:4px">
    </label>
    <label style="display:block;margin-bottom:12px">Nova senha (mín. 8 caracteres)
      <input id="s-nova" type="password" required minlength="8" style="width:100%;box-sizing:border-box;margin-top:4px">
    </label>
    <label style="display:block;margin-bottom:16px">Confirmar nova senha
      <input id="s-confirma" type="password" required style="width:100%;box-sizing:border-box;margin-top:4px">
    </label>
    <button type="submit" style="background:#16a34a">Salvar nova senha</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
async function carregar() {
  const r = await fetch('/api/usuarios/eu');
  if (!r.ok) return;
  const u = await r.json();
  document.getElementById('mc-nome').textContent = u.nome;
  document.getElementById('mc-email').textContent = u.email;
  const rotulo = { admin: 'admin', operador: 'operador', cliente: 'cliente' }[u.papel] || u.papel;
  document.getElementById('mc-papel').textContent = rotulo;
}

async function trocarSenha(e) {
  e.preventDefault();
  const nova = document.getElementById('s-nova').value;
  const confirma = document.getElementById('s-confirma').value;
  if (nova !== confirma) { avisar('As senhas novas não conferem.', 'err'); return; }
  const res = await fetch('/api/usuarios/eu/senha', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ senha_atual: document.getElementById('s-atual').value, senha_nova: nova }),
  });
  if (res.ok) {
    document.getElementById('form-senha').reset();
    avisar('Senha trocada. Suas outras sessões (outros navegadores/aparelhos) foram desconectadas.', 'ok');
  } else {
    await avisarResposta(res);
  }
}

carregar();
</script>
{% endblock %}
