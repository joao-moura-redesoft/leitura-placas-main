{% extends "base.html" %}
{% block title %}Ao Vivo — ALPR{% endblock %}
{% block conteudo %}
<h1>Ao Vivo</h1>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px">
  <div>
    <div id="grid-cameras" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px"></div>
    <div id="stats" style="margin-top:10px;font-size:13px;color:#94a3b8"></div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Últimas Detecções</h2>
    <ul id="recentes" style="list-style:none;padding:0;margin:0"></ul>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── HLS helpers ───────────────────────────────────────────────────────────
const _hlsInstances = {};   // camera_id → Hls instance

function _anexarHLS(cameraId) {
  const el = document.getElementById(`prev-${cameraId}`);
  if (!el || el.tagName !== 'VIDEO') return;
  if (_hlsInstances[cameraId]) return;   // já configurado
  const url = `/hls/${cameraId}/index.m3u8`;
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    const hls = new Hls({ lowLatencyMode: true, maxBufferLength: 4 });
    hls.loadSource(url);
    hls.attachMedia(el);
    _hlsInstances[cameraId] = hls;
  } else if (el.canPlayType('application/vnd.apple.mpegurl')) {
    el.src = url;  // Safari / iOS: suporte nativo
  }
}

function _elementoStream(c, modo, detAuto) {
  if (!detAuto) {
    return `<div id="prev-${c.id}" style="width:100%;aspect-ratio:16/9;background:#f8fafc;border-radius:6px;
                   display:flex;align-items:center;justify-content:center;
                   color:#94a3b8;font-size:13px;border:2px dashed #e2e8f0">
               Clique em Ler Placa para capturar
             </div>`;
  }
  if (modo === 'hls') {
    return `<video id="prev-${c.id}" autoplay muted playsinline
                   style="width:100%;border-radius:6px;display:block;background:#000"
                   onerror="this.style.opacity='.3'"></video>`;
  }
  return `<img id="prev-${c.id}" src="/stream/${c.id}.mjpg" alt="Bomba ${c.bomba} Lado ${c.lado}"
               style="width:100%;border-radius:6px;display:block"
               onerror="this.style.opacity='.3'">`;
}

async function carregarGrid() {
  const [cameras, statsData] = await Promise.all([
    fetch('/api/cameras').then(r => r.json()).catch(() => []),
    fetch('/api/stats').then(r => r.json()).catch(() => ({})),
  ]);
  const detAuto = statsData.deteccao_automatica !== false;
  const modo = statsData.streaming_modo || 'mjpeg';
  const ativas = cameras.filter(c => c.ativo).sort((a, b) => a.bomba - b.bomba || a.lado - b.lado);
  const grid = document.getElementById('grid-cameras');
  if (!ativas.length) {
    grid.innerHTML = '<div class="card" style="color:#94a3b8;padding:32px;text-align:center">'
      + 'Nenhuma câmera cadastrada. <a href="/cameras" style="color:#16a34a">Cadastre câmeras</a> para iniciar o monitoramento.</div>';
    return;
  }
  grid.innerHTML = ativas.map(c => `
    <div class="card stream-wrapper">
      <div style="font-size:12px;margin-bottom:6px">
        <strong>Bomba ${c.bomba} · Lado ${String(c.lado).padStart(2,'0')}</strong>
        <span style="color:#94a3b8">${c.nome ? ' — ' + esc(c.nome) : ''}</span>
      </div>
      ${_elementoStream(c, modo, detAuto)}
      <button id="btn-${c.id}" onclick="lerPlaca(${c.id})"
              style="width:100%;margin-top:8px;padding:12px;background:#16a34a;border:none;
                     border-radius:9999px;color:#fff;font-size:15px;font-weight:600;cursor:pointer">
        Ler Placa
      </button>
      <div id="res-${c.id}" style="display:none;margin-top:8px;padding:14px;border-radius:8px;
                                    background:#f8fafc;border:1px solid #e2e8f0;text-align:center"></div>
    </div>
  `).join('');

  // Inicializa HLS.js após o DOM ser atualizado
  if (modo === 'hls' && detAuto) {
    ativas.forEach(c => _anexarHLS(c.id));
  }
}

async function atualizarStats() {
  try {
    const r = await fetch('/api/stats').then(r => r.json());
    document.getElementById('stats').textContent =
      `FPS: ${r.fps.toFixed(1)} · Hoje: ${r.hoje} · Total: ${r.total} · Pipeline: ${r.pipeline ? 'rodando' : 'parado'}`;
  } catch (e) {}
}

async function atualizarRecentes() {
  try {
    const r = await fetch('/api/recentes').then(r => r.json());
    document.getElementById('recentes').innerHTML = r.map(d => _itemFeed(d)).join('');
  } catch (e) {}
}

function _itemFeed(d) {
  const alertaNegra = d.lista === 'negra'
    ? '<span class="badge badge-err" style="margin-left:4px">ALERTA</span>' : '';
  return `<li class="feed-item">
    <span class="feed-placa">${esc(d.placa)}</span>
    <span>
      <span class="badge badge-${d.padrao}">${d.padrao}</span>
      ${alertaNegra}
      <small style="color:#94a3b8;margin-left:6px">${new Date(d.criado_em).toLocaleTimeString()}</small>
    </span>
  </li>`;
}

// ── WebSocket: feed em tempo real ──────────────────────────────────────────
let _ws = null, _wsDelay = 1000;

function _conectarWS() {
  if (_ws && _ws.readyState < 2) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  _ws = new WebSocket(`${proto}//${location.host}/ws`);

  _ws.onopen  = () => { _wsDelay = 1000; };
  _ws.onerror = () => _ws.close();
  _ws.onclose = () => {
    _ws = null;
    setTimeout(_conectarWS, _wsDelay);
    _wsDelay = Math.min(_wsDelay * 2, 30000);
  };
  _ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.tipo !== 'deteccao') return;
      const ul = document.getElementById('recentes');
      ul.insertAdjacentHTML('afterbegin', _itemFeed(d));
      while (ul.children.length > 20) ul.removeChild(ul.lastChild);
      if (d.lista === 'negra') _flashAlertaNegra(d.placa);
    } catch (_) {}
  };
}

function _flashAlertaNegra(placa) {
  const banner = document.createElement('div');
  banner.style.cssText = `position:fixed;top:70px;right:20px;z-index:999;
    background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;
    padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);animation:fadeIn .3s ease`;
  banner.textContent = `⚠ Lista negra: ${placa}`;
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 6000);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function lerPlaca(cameraId) {
  const btn = document.getElementById(`btn-${cameraId}`);
  const res = document.getElementById(`res-${cameraId}`);
  btn.disabled = true;
  btn.textContent = '⏳ Analisando...';
  btn.style.background = '#166534';
  res.style.display = 'none';

  try {
    const r = await fetch(`/api/cameras/${cameraId}/ler-placa`, { method: 'POST' });
    const d = await r.json();

    // Atualiza o preview do card com o frame capturado (modo manual)
    if (d.frame_url) {
      const prev = document.getElementById(`prev-${cameraId}`);
      if (prev && prev.tagName !== 'IMG') {
        const img = document.createElement('img');
        img.id = `prev-${cameraId}`;
        img.src = d.frame_url + '?t=' + Date.now();
        img.style.cssText = 'width:100%;border-radius:6px;display:block';
        prev.replaceWith(img);
      } else if (prev) {
        prev.src = d.frame_url + '?t=' + Date.now();
      }
    }

    if (!r.ok) {
      res.innerHTML = `<span style="color:#b91c1c">Erro: ${esc(d.detail || d.mensagem || 'falha')}</span>`;
    } else if (!d.placa) {
      res.innerHTML = `<span style="color:#94a3b8">${esc(d.mensagem || 'Nenhuma placa detectada')}</span>`;
    } else {
      const snapVotosHtml = (d.total_snapshots > 1)
        ? `&nbsp;<span style="color:${d.votos_snapshot >= d.total_snapshots ? '#15803d' : d.votos_snapshot > 1 ? '#a16207' : '#b91c1c'}"
                      title="Fotos analisadas: ${d.total_snapshots}">
             ${d.votos_snapshot}/${d.total_snapshots} fotos
           </span>`
        : '';
      const engVotosHtml = (d.total_engines > 1)
        ? `&nbsp;<span style="color:${d.votos_ocr >= d.total_engines ? '#15803d' : d.votos_ocr > 1 ? '#a16207' : '#b91c1c'}"
                      title="${(d.detalhes_ocr || []).map(e => e.engine + ': ' + (e.placa || '?')).join(' | ')}">
             ${d.votos_ocr}/${d.total_engines} engines
           </span>`
        : '';
      res.innerHTML = `
        <div style="font-size:32px;font-weight:700;letter-spacing:5px;color:#0f172a;font-family:'Consolas',monospace">${esc(d.placa)}</div>
        <div style="margin-top:6px;font-size:12px;color:#94a3b8">
          <span class="badge badge-${d.padrao}">${d.padrao}</span>
          &nbsp;${Math.round(d.confianca * 100)}% confiança
          ${snapVotosHtml}${engVotosHtml}
          ${d.snapshot ? `&nbsp;<a href="${d.snapshot}" target="_blank" style="color:#16a34a">ver foto</a>` : ''}
        </div>`;
    }
    res.style.display = 'block';
  } catch (ex) {
    res.innerHTML = `<span style="color:#b91c1c">Erro de rede: ${esc(ex.message)}</span>`;
    res.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '📷 Ler Placa';
    btn.style.background = '#16a34a';
  }
}

carregarGrid();
atualizarStats();
atualizarRecentes();        // carga inicial do histórico
setInterval(atualizarStats, 1000);
_conectarWS();              // substitui setInterval de recentes
</script>
{% endblock %}
