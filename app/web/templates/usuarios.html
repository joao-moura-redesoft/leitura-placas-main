{% extends "base.html" %}
{% block title %}Usuários — ALPR{% endblock %}
{% block conteudo %}
<h1>Usuários</h1>

<div class="card" style="margin-bottom:16px">
  <button onclick="abrirModal()">+ Novo Usuário</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Ativo</th><th>Ações</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="sem-itens" style="display:none;color:#94a3b8">Nenhum usuário cadastrado.</p>
</div>

<!-- Modal -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);z-index:100;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:28px;width:440px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.18)">
    <h2 id="modal-titulo" style="margin-top:0">Novo Usuário</h2>
    <form id="form" onsubmit="salvar(event)">
      <input type="hidden" id="f-id" value="">
      <label style="display:block;margin-bottom:12px">Nome
        <input id="f-nome" type="text" required style="width:100%;box-sizing:border-box;margin-top:4px">
      </label>
      <label style="display:block;margin-bottom:12px">E-mail
        <input id="f-email" type="email" required style="width:100%;box-sizing:border-box;margin-top:4px">
      </label>
      <label style="display:block;margin-bottom:12px">Senha
        <input id="f-senha" type="password" autocomplete="new-password" minlength="8" style="width:100%;box-sizing:border-box;margin-top:4px">
        <small id="f-senha-dica" style="color:#94a3b8;display:none">Deixe em branco para manter a senha atual.</small>
      </label>
      <label style="display:block;margin-bottom:12px">Papel
        <select id="f-papel" style="width:100%;box-sizing:border-box;margin-top:4px">
          <option value="usuario">Usuário</option>
          <option value="admin">Administrador</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <input id="f-ativo" type="checkbox" checked style="width:auto;padding:0">
        Ativo
      </label>
      <div style="display:flex;gap:10px">
        <button type="submit" style="background:#16a34a">Salvar</button>
        <button type="button" onclick="fecharModal()" style="background:#fff;color:#374151;border:1px solid #e2e8f0">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<style>#modal-overlay.aberto { display: flex !important; }</style>
{% endblock %}

{% block scripts %}
<script>
let _itens = [];
let _editandoId = null;
let _euId = null;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function carregar() {
  const [resEu, res] = await Promise.all([fetch('/api/usuarios/eu'), fetch('/api/usuarios')]);
  if (resEu.ok) _euId = (await resEu.json()).id;
  if (!res.ok) return avisarResposta(res);
  _itens = await res.json();
  renderTabela();
}

function renderTabela() {
  const tbody = document.getElementById('tbody');
  const sem = document.getElementById('sem-itens');
  tbody.innerHTML = '';
  if (!_itens.length) { sem.style.display = ''; return; }
  sem.style.display = 'none';
  _itens.forEach(it => {
    const papel = it.papel === 'admin'
      ? '<span class="badge badge-warn">Administrador</span>'
      : '<span class="badge badge-mercosul">Usuário</span>';
    const ativo = it.ativo
      ? '<span class="badge badge-ok">Ativo</span>'
      : '<span class="badge badge-err">Inativo</span>';
    const souEu = it.id === _euId;
    tbody.innerHTML += `<tr>
      <td>${esc(it.nome)}${souEu ? ' <small style="color:#94a3b8">(você)</small>' : ''}</td>
      <td>${esc(it.email)}</td>
      <td>${papel}</td>
      <td>${ativo}</td>
      <td>
        <button onclick="editar(${it.id})" style="background:#16a34a;margin-right:4px">Editar</button>
        <button onclick="remover(${it.id})" style="background:#dc2626" ${souEu ? 'disabled title="Você não pode remover seu próprio usuário"' : ''}>Remover</button>
      </td>
    </tr>`;
  });
}

function abrirModal(it = null) {
  _editandoId = it ? it.id : null;
  document.getElementById('modal-titulo').textContent = it ? 'Editar Usuário' : 'Novo Usuário';
  document.getElementById('f-id').value = it ? it.id : '';
  document.getElementById('f-nome').value = it ? it.nome : '';
  document.getElementById('f-email').value = it ? it.email : '';
  document.getElementById('f-senha').value = '';
  document.getElementById('f-senha').required = !it;
  document.getElementById('f-senha-dica').style.display = it ? '' : 'none';
  document.getElementById('f-papel').value = it ? it.papel : 'usuario';
  document.getElementById('f-ativo').checked = it ? !!it.ativo : true;
  document.getElementById('modal-overlay').classList.add('aberto');
}

function fecharModal() { document.getElementById('modal-overlay').classList.remove('aberto'); }

function editar(id) {
  const it = _itens.find(x => x.id === id);
  if (it) abrirModal(it);
}

async function salvar(e) {
  e.preventDefault();
  const payload = {
    nome: document.getElementById('f-nome').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    papel: document.getElementById('f-papel').value,
    ativo: document.getElementById('f-ativo').checked,
  };
  const senha = document.getElementById('f-senha').value;
  if (senha) payload.senha = senha;
  const url = _editandoId ? `/api/usuarios/${_editandoId}` : '/api/usuarios';
  const metodo = _editandoId ? 'PUT' : 'POST';
  const res = await fetch(url, { method: metodo, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (res.ok) { fecharModal(); await carregar(); }
  else await avisarResposta(res);
}

async function remover(id) {
  if (id === _euId) return;
  const it = _itens.find(x => x.id === id);
  if (!confirmarExclusao(it?.nome, `o usuário "${it?.nome}" e o acesso dele ao sistema`)) return;
  const res = await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
  if (res.ok) await carregar();
  else await avisarResposta(res);
}

carregar();
</script>
{% endblock %}
