[project]
name = "leitura-placas"
version = "0.1.0"
description = "Sistema de reconhecimento automático de placas (ALPR)"
requires-python = ">=3.10"
# Dependências de execução continuam declaradas em requirements.txt.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Só `testes/unitarios`: o resto de `testes/` é o harness manual de acurácia de OCR
# (baixa imagem, roda modelo, leva minutos) e não deve entrar numa rodada de regressão.
testpaths = ["testes/unitarios"]
addopts = "-q --strict-markers"
filterwarnings = [
    # As dependências de visão (torch/easyocr/paddle) despejam avisos de deprecação a
    # cada import e afogam a saída da suíte.
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
