<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ALPR{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #071f10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ── Container principal ── */
  .auth-wrapper {
    display: flex;
    width: 100%;
    max-width: 1000px;
    min-height: 580px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
  }

  /* ── Painel esquerdo (formulário) ── */
  .auth-left {
    flex: 0 0 460px;
    background: #fff;
    padding: 48px 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .auth-logo-icon {
    width: 36px; height: 36px;
    background: #16a34a;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .auth-logo-icon svg { color: #fff; }
  .auth-logo-text {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: -.3px;
  }

  .auth-title {
    font-size: 24px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .auth-sub {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 28px;
  }

  /* ── Campos ── */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    margin-bottom: 6px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap .icon {
    position: absolute;
    left: 12px;
    color: #9ca3af;
    display: flex;
    pointer-events: none;
  }
  .input-wrap input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    color: #1e293b;
    background: #f8fafc;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .input-wrap input:focus {
    border-color: #16a34a;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(22,163,74,.12);
  }
  .input-wrap input::placeholder { color: #94a3b8; }

  /* toggle senha */
  .toggle-pass {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    padding: 0;
    display: flex;
    align-items: center;
  }
  .toggle-pass:hover { color: #475569; }

  /* ── Linha lembrar / esqueceu ── */
  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 13px;
  }
  .auth-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #374151;
    cursor: pointer;
    font-size: 13px;
  }
  .auth-row input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: #16a34a;
  }

  /* ── Botão principal ── */
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 9999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, box-shadow .15s, transform .1s;
    letter-spacing: .01em;
  }
  .btn-primary:hover {
    background: #15803d;
    box-shadow: 0 4px 14px rgba(22,163,74,.35);
  }
  .btn-primary:active { transform: scale(.99); }

  /* ── Badge primeiro acesso ── */
  .badge-admin {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f0fdf4;
    color: #15803d;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: .05em;
    border: 1px solid #bbf7d0;
  }

  /* ── Rodapé do form ── */
  .auth-footer {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: #64748b;
  }
  .auth-footer a { color: #16a34a; text-decoration: none; font-weight: 500; }
  .auth-footer a:hover { text-decoration: underline; }

  /* ── Alertas ── */
  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 4px;
    margin-bottom: 8px;
  }
  .alert-err { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .alert-ok  { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

  /* ── Grid 2 colunas ── */
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* ── Painel direito (ilustração) ── */
  .auth-right {
    flex: 1;
    background: linear-gradient(135deg, #0b3d1e 0%, #166534 50%, #071f10 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
    overflow: hidden;
  }

  /* Círculos decorativos de fundo */
  .auth-right::before {
    content: '';
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .auth-right::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .right-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* Card central da ilustração */
  .illus-card {
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    padding: 22px 28px;
    width: 260px;
  }
  .illus-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.15);
  }
  .illus-row:last-child { border-bottom: none; }
  .illus-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .illus-lines { flex: 1; }
  .illus-line-1 {
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,.7);
    margin-bottom: 4px;
    width: 80%;
  }
  .illus-line-2 {
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,.35);
    width: 55%;
  }
  .illus-badge {
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: #fff;
    white-space: nowrap;
    font-weight: 600;
  }

  /* Ícones flutuantes ao redor */
  .float-icon {
    position: absolute;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,.95);
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .float-icon.top-left  { top: 28%;  left: 12%; }
  .float-icon.mid-left  { top: 48%;  left: 6%;  }
  .float-icon.bot-left  { top: 68%;  left: 14%; }

  /* Linha conectando ícones ao card */
  .connector {
    position: absolute;
    height: 2px;
    background: rgba(255,255,255,.25);
    z-index: 1;
    transform-origin: left center;
  }

  .right-text { text-align: center; color: #fff; }
  .right-text h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .right-text p  { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.5; }

  /* ── Responsivo ── */
  @media (max-width: 720px) {
    .auth-wrapper { max-width: 420px; flex-direction: column; min-height: unset; }
    .auth-left    { flex: none; padding: 36px 28px; }
    .auth-right   { display: none; }
    .row-2        { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="auth-wrapper">

  <!-- Painel esquerdo: formulário -->
  <div class="auth-left">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <span class="auth-logo-text">ALPR — Leitura de Placas</span>
    </div>

    {% block conteudo %}{% endblock %}
  </div>

  <!-- Painel direito: ilustração -->
  <div class="auth-right">

    <!-- Ícones flutuantes -->
    <div class="float-icon top-left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7 16 12 23 17V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
    </div>
    <div class="float-icon mid-left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M12 12h.01"/>
        <path d="M6 10h.01M18 10h.01M6 14h.01M18 14h.01"/>
      </svg>
    </div>
    <div class="float-icon bot-left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>

    <!-- Card central -->
    <div class="right-content">
      <div class="illus-card">
        <div class="illus-row">
          <div class="illus-avatar">🚗</div>
          <div class="illus-lines">
            <div class="illus-line-1"></div>
            <div class="illus-line-2"></div>
          </div>
          <div class="illus-badge">ABC1D23</div>
        </div>
        <div class="illus-row">
          <div class="illus-avatar">🚙</div>
          <div class="illus-lines">
            <div class="illus-line-1" style="width:65%"></div>
            <div class="illus-line-2" style="width:40%"></div>
          </div>
          <div class="illus-badge">XYZ5F78</div>
        </div>
        <div class="illus-row">
          <div class="illus-avatar">🚕</div>
          <div class="illus-lines">
            <div class="illus-line-1" style="width:75%"></div>
            <div class="illus-line-2" style="width:50%"></div>
          </div>
          <div class="illus-badge">DEF3G45</div>
        </div>
      </div>

      <div class="right-text">
        <h2>Reconhecimento automático de placas</h2>
        <p>Controle de acesso e monitoramento<br>de veículos em tempo real.</p>
      </div>
    </div>

  </div>
</div>
</body>
</html>
