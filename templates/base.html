<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Leitura de Placas{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f0fdf4;
    color: #1e293b;
    min-height: 100vh;
  }

  /* ── Navbar ── */
  nav {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    margin-right: 16px;
    flex-shrink: 0;
  }
  .nav-brand-icon {
    width: 30px; height: 30px;
    background: #16a34a;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .nav-brand-text {
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -.2px;
  }
  nav a:not(.nav-brand) {
    color: #64748b;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 6px;
    transition: color .15s, background .15s;
    white-space: nowrap;
  }
  nav a:not(.nav-brand):hover { color: #16a34a; background: #f0fdf4; }
  .nav-logout { margin-left: auto !important; font-size: 13px !important; color: #94a3b8 !important; }
  .nav-logout:hover { color: #64748b !important; background: #f8fafc !important; }

  /* ── Layout ── */
  main { padding: 28px 24px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 20px; }
  h2 { font-size: 16px; font-weight: 600; color: #0f172a; }
  h3 { font-size: 14px; font-weight: 600; color: #374151; }

  /* ── Cards ── */
  .card {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }

  /* ── Tables ── */
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #f8fafc; }
  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .05em;
    border-bottom: 2px solid #e2e8f0;
  }
  td {
    padding: 10px 14px;
    font-size: 14px;
    color: #374151;
    border-bottom: 1px solid #f1f5f9;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }

  /* ── Form elements ── */
  input, select, textarea {
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #1e293b;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #16a34a;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(22,163,74,.12);
  }
  input::placeholder, textarea::placeholder { color: #94a3b8; }
  label { display: block; font-size: 13px; color: #64748b; font-weight: 500; }
  label input, label select { margin-top: 4px; }

  /* ── Buttons ── */
  button {
    padding: 8px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
    font-family: inherit;
    background: #16a34a;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover { background: #15803d; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }

  /* ── Stream ── */
  .stream-wrapper { max-width: 100%; }
  .stream-wrapper img { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; }

  /* ── Badges ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .badge-mercosul { background: #dbeafe; color: #1d4ed8; }
  .badge-antigo   { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .badge-ok       { background: #dcfce7; color: #15803d; }
  .badge-warn     { background: #fef9c3; color: #a16207; }
  .badge-err      { background: #fee2e2; color: #b91c1c; }

  /* ── Status grid ── */
  .grid-status {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .status-cell {
    background: #f8fafc;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
  }
  .status-cell .label {
    font-size: 11px;
    text-transform: uppercase;
    color: #94a3b8;
    letter-spacing: .05em;
    font-weight: 500;
  }
  .status-cell .value {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
    word-break: break-word;
    color: #0f172a;
  }

  /* ── Log pane ── */
  .log-pane {
    font-family: 'Consolas','Monaco',monospace;
    font-size: 12px;
    max-height: 360px;
    overflow-y: auto;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 12px;
  }
  .log-line {
    padding: 2px 0;
    border-bottom: 1px solid #f1f5f9;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-INFO    { color: #374151; }
  .log-WARNING { color: #92400e; }
  .log-ERROR   { color: #b91c1c; }
  .log-DEBUG   { color: #94a3b8; }

  /* ── Feed ── */
  .feed-item {
    padding: 10px 0;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-placa {
    font-family: 'Consolas', monospace;
    font-weight: 700;
    font-size: 15px;
    color: #0f172a;
    letter-spacing: .04em;
  }

  /* ── Alerts ── */
  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .alert-err  { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .alert-ok   { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    main { padding: 16px; }
    nav { height: auto; padding: 8px 12px; gap: 2px; }
    nav a:not(.nav-brand) { font-size: 12px; padding: 5px 7px; }
    .nav-logout { margin-left: 0 !important; }
  }
</style>
<!-- HLS.js: usado quando streaming_modo = hls. Chrome/Firefox não suportam HLS nativamente. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
// Redireciona para /login em qualquer resposta 401 de API — sessão expirada ou inválida.
(function () {
  const _orig = window.fetch;
  window.fetch = async function (...args) {
    const r = await _orig(...args);
    if (r.status === 401) {
      const url = typeof args[0] === 'string' ? args[0] : (args[0].url || '');
      // Não redireciona em chamadas de auth para evitar loop
      if (!url.includes('/login') && !url.includes('/criar-admin')) {
        location.href = '/login';
        return new Promise(() => {});   // interrompe a cadeia de .then()
      }
    }
    return r;
  };
})();
</script>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">
    <div class="nav-brand-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M12 12h.01"/>
        <path d="M6 10h.01M18 10h.01M6 14h.01M18 14h.01"/>
      </svg>
    </div>
    <span class="nav-brand-text">ALPR</span>
  </a>
  <a href="/">Ao Vivo</a>
  <a href="/dashboard">Dashboard</a>
  <a href="/historico">Histórico</a>
  <a href="/listas">Listas</a>
  <a href="/cameras">Câmeras</a>
  <a href="/configuracao">Configuração</a>
  <a href="/testes">Testes</a>
  <a href="/documentacao">Documentação</a>
  <a href="/logout" class="nav-logout">Sair</a>
</nav>
<main>
  {% block conteudo %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
